name: Release
# Pushing a tag like v0.2.0 builds the client, packs the installer and the
# update packages with Velopack, and publishes them as a GitHub release. The
# in-app updater reads the newest release's feed, so a release must live in a
# repository the app can read without a token (see docs/RELEASING.md).
#
# By default the release goes to the repository the tag was pushed to. To
# publish somewhere else (for example a public releases repository while the
# source stays private) set the repository variable RELEASES_REPO to
# "owner/name" and the secret RELEASES_TOKEN to a token that may write
# releases there.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Pack and publish
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      # Must match the `velopack` crate in client/apps/desktop/Cargo.toml.
      VPK_VERSION: '1.3.39-g8d2844f'
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must match the workspace version
        shell: pwsh
        run: |
          $match = Select-String -Path client/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ($env:TAG -ne "v$version") {
            throw "Tag $($env:TAG) does not match the workspace version $version in client/Cargo.toml."
          }
          "VERSION=$version" | Add-Content $env:GITHUB_ENV
      - name: Install the documented Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: client -> target
          cache-bin: "false"
          save-if: "false"
      - name: Build the desktop client
        working-directory: client
        run: cargo build --locked --release -p ts6-desktop
      - name: Install the Velopack packer
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version $env:VPK_VERSION
          "$HOME/.dotnet/tools" | Add-Content $env:GITHUB_PATH
      - name: Fetch the previous release (so this one can ship a small delta)
        shell: pwsh
        run: |
          # The first release has nothing to fetch; that is fine.
          vpk download github --repoUrl "https://github.com/$env:RELEASES_REPO" --token $env:RELEASES_TOKEN --outputDir dist/installer
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous release; packing a full one.'; $global:LASTEXITCODE = 0 }
      - name: Release notes from the changelog
        shell: pwsh
        run: |
          # The "Unreleased" section becomes the notes shown in the app's update page.
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern '^## Unreleased').LineNumber
          $notes = @()
          if ($start) {
            foreach ($line in $lines[$start..($lines.Count - 1)]) {
              if ($line -match '^## ') { break }
              $notes += $line
            }
          }
          ($notes -join "`n").Trim() | Set-Content release-notes.md
      - name: Pack the installer and update packages
        shell: pwsh
        run: ./scripts/pack_installer.ps1 -Version $env:VERSION -Notes release-notes.md
      - name: Publish the release
        shell: pwsh
        run: |
          vpk upload github --outputDir dist/installer --repoUrl "https://github.com/$env:RELEASES_REPO" `
            --token $env:RELEASES_TOKEN --publish --tag $env:TAG --releaseName "Mirage $env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed with exit code $LASTEXITCODE" }
          # Checksum of the installer, for people who verify downloads by hand.
          $env:GH_TOKEN = $env:RELEASES_TOKEN
          gh release upload $env:TAG (Get-ChildItem dist/installer -Filter '*.sha256').FullName --repo $env:RELEASES_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mirage-installer-${{ env.VERSION }}
          path: dist/installer/*
          retention-days: 30
          if-no-files-found: error
