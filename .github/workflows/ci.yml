name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows offline checks
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/apps/ui/.node-version
          cache: npm
          cache-dependency-path: client/apps/ui/package-lock.json
      - name: Repository policy checks
        run: python scripts/check_repository.py
      - name: Harness unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Install the documented Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            client -> target
            recon/probe-ts6 -> target
            recon/probe-capture -> target
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Rust formatting
        working-directory: client
        run: cargo fmt -p ts6-core -p ts6-audio -p ts6-input -p ts6-cli -p ts6-bridge -p ts6-desktop -- --check
      - name: Rust lint
        working-directory: client
        run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
      - name: Rust tests
        working-directory: client
        run: cargo test --locked --workspace
      - name: Rust build
        working-directory: client
        run: cargo build --locked --workspace
      - name: Standalone probe check
        run: cargo check --locked --manifest-path recon/probe-ts6/Cargo.toml
      # Pure tests only (RTP, bitstream, encoder selection); hardware and
      # desktop tests are #[ignore]d and need a local run.
      - name: Native capture probe lint and tests
        run: |
          cargo clippy --locked --manifest-path recon/probe-capture/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path recon/probe-capture/Cargo.toml
      - name: Reproducible UI installation
        working-directory: client/apps/ui
        run: npm ci --ignore-scripts
      - name: UI type check and build
        working-directory: client/apps/ui
        run: npm run build
      # The smoke test serves the built UI, so the UI is also built here.
      - name: HTTP and WebSocket security smoke test
        run: python scripts/smoke_bridge.py --binary client/target/debug/ts6-bridge.exe
  ui:
    name: UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/apps/ui/.node-version
          cache: npm
          cache-dependency-path: client/apps/ui/package-lock.json
      - name: Reproducible UI installation
        working-directory: client/apps/ui
        run: npm ci --ignore-scripts
      - name: UI type check and build
        working-directory: client/apps/ui
        run: npm run build
      - name: UI dependency audit
        working-directory: client/apps/ui
        run: npm audit
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the documented Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      # Keeps the compiled cargo-audit binary between runs, so `cargo install`
      # finds it already installed instead of building it from source.
      - name: Restore cargo-audit binary
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: cargo-audit-0.23.0
          workspaces: client
          cache-targets: "false"
          cache-bin: "true"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install pinned audit tool
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit client lockfile
        run: cargo audit --file client/Cargo.lock
      - name: Audit standalone probe lockfile
        if: success() || failure()
        run: cargo audit --file recon/probe-ts6/Cargo.lock
      - name: Audit native capture probe lockfile
        if: success() || failure()
        run: cargo audit --file recon/probe-capture/Cargo.lock
  secrets:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable history without exposing values
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .'
