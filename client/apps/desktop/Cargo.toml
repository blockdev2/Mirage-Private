[package]
name = "ts6-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Windows desktop frontend for the ts6-bridge WebSocket service"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
raw-window-handle = "0.6.2"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.30.0"
# Same version as the `vpk` packer in CI and docs/RELEASING.md.
velopack = "=1.3.39-g8d2844f"
ts6-bridge = { path = "../../crates/ts6-bridge" }
ts6-core = { path = "../../crates/ts6-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
