[package]
name = "ts6-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local WebSocket bridge that owns a TS6 session and feeds the desktop UI"

[dependencies]
ts6-core = { path = "../ts6-core" }
ts6-audio = { path = "../ts6-audio" }
ts6-input = { path = "../ts6-input" }

anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
# Watching TS6 screen streams (WebRTC from the official client).
webrtc = "=0.21.1"
rtc = "=0.21.1"
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
