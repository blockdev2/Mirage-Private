[package]
name = "ts6-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native WebRTC publisher and viewer for TeamSpeak 6 streams (signaling-agnostic peers)"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
rtc = "0.21.1"
webrtc = "0.21.1"
socket2 = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
