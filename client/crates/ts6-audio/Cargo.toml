[package]
name = "ts6-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio plane for the TS6 client: Opus codec, frame sources, metering and mixing"

[dependencies]
ts6-core = { path = "../ts6-core" }
# The audio feature of the vendored library provides the per-peer jitter buffer
# (`tsclientlib::audio::AudioHandler`) and pulls in audiopus.
tsclientlib = { path = "../../vendor/tsclientlib/tsclientlib", default-features = false, features = [
    "audio",
] }
tsproto-packets = { path = "../../vendor/tsclientlib/utils/tsproto-packets" }
# Same audiopus version as the vendored tsclientlib, so only one libopus is linked.
audiopus = "0.3.0-rc.0"
cpal = "0.18"
tokio = { version = "1", features = ["sync"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
nnnoiseless = { version = "0.5", default-features = false }
# DPDFNet (Apache-2.0) runs as an ONNX model; tract is a pure-Rust ONNX runtime,
# so there is no native library to ship. realfft is already pulled in by RNNoise.
tract-onnx = { version = "0.23", default-features = false }
realfft = "3.5"

[dev-dependencies]
approx = "0.5"

[target.'cfg(windows)'.dependencies]
# Same version as ts6-capture: WASAPI process loopback for stream sound.
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
