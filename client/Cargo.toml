[workspace]
resolver = "2"
members = [
    "crates/ts6-core",
    "crates/ts6-audio",
    "crates/ts6-input",
    "crates/ts6-cli",
    "crates/ts6-bridge",
    "crates/ts6-stream",
    "crates/ts6-capture",
    "apps/desktop",
]
# Vendored upstream code lives in its own workspace and must not be a member here.
exclude = ["vendor"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/blockdev2/Mirage-Private"

[profile.release]
lto = "thin"
codegen-units = 1

# Real-time audio DSP must keep up with 48 kHz even in debug builds: the
# RNNoise denoiser and its FFT are far slower than real time unoptimized.
[profile.dev.package.nnnoiseless]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

# Dependencies (WebRTC, RTP, Opus, egui) run optimized even in dev builds:
# unoptimized, a watched 1080p stream drops packets and frames.
[profile.dev.package."*"]
opt-level = 2

# The bridge converts every decoded frame (NV12 to RGBA) on its own.
[profile.dev.package.ts6-bridge]
opt-level = 3

# Every watched stream frame (up to 1080p, 60 per second) is turned into a
# texture on the interface thread; unoptimized, that stalls the window.
[profile.dev.package.epaint]
opt-level = 3

[profile.dev.package.ecolor]
opt-level = 3

# DPDFNet runs a neural network every 10 ms, so tract and the numeric crates it
# leans on need optimization even in debug builds; without it the model runs
# slower than real time. Listed one by one on purpose: a wildcard would also
# rebuild the native libopus (audiopus_sys), which needs CMake. Test
# `dpdfnet::tests::it_keeps_up_with_real_time` fails if one is missing.
[profile.dev.package]
tract-core = { opt-level = 3, debug-assertions = false, overflow-checks = false }
tract-data = { opt-level = 3, debug-assertions = false, overflow-checks = false }
tract-linalg = { opt-level = 3, debug-assertions = false, overflow-checks = false }
tract-hir = { opt-level = 3, debug-assertions = false, overflow-checks = false }
tract-nnef = { opt-level = 3, debug-assertions = false, overflow-checks = false }
tract-onnx = { opt-level = 3, debug-assertions = false, overflow-checks = false }
tract-onnx-opl = { opt-level = 3, debug-assertions = false, overflow-checks = false }
tract-extra = { opt-level = 3, debug-assertions = false, overflow-checks = false }
ndarray = { opt-level = 3, debug-assertions = false, overflow-checks = false }
smallvec = { opt-level = 3, debug-assertions = false, overflow-checks = false }
num-traits = { opt-level = 3, debug-assertions = false, overflow-checks = false }
num-complex = { opt-level = 3, debug-assertions = false, overflow-checks = false }
num-integer = { opt-level = 3, debug-assertions = false, overflow-checks = false }
num-rational = { opt-level = 3, debug-assertions = false, overflow-checks = false }
half = { opt-level = 3, debug-assertions = false, overflow-checks = false }
bit-set = { opt-level = 3, debug-assertions = false, overflow-checks = false }
bit-vec = { opt-level = 3, debug-assertions = false, overflow-checks = false }
anymap3 = { opt-level = 3, debug-assertions = false, overflow-checks = false }
downcast-rs = { opt-level = 3, debug-assertions = false, overflow-checks = false }
dyn-clone = { opt-level = 3, debug-assertions = false, overflow-checks = false }
prost = { opt-level = 3, debug-assertions = false, overflow-checks = false }
ts6-audio = { opt-level = 3, debug-assertions = false, overflow-checks = false }
matrixmultiply = { opt-level = 3, debug-assertions = false, overflow-checks = false }
rawpointer = { opt-level = 3, debug-assertions = false, overflow-checks = false }
itertools = { opt-level = 3, debug-assertions = false, overflow-checks = false }
